<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abajur Interativo</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 10%;
font-family:Arial,sans-serif;
background:#0b0c10;
transition:0.5s ease;
}

/* ILUMINAÇÃO */

body.light-on{
background:
radial-gradient(
circle at 82% 45%,
rgba(255,213,79,0.18),
transparent 25%
),
#0b0c10;
}

/* LOGIN */

.login-box{
width:340px;
padding:35px;
border-radius:18px;
background:#1c1f24;
box-shadow:0 25px 50px rgba(0,0,0,0.45);

opacity:0;
transform:translateX(-70px);

transition:
opacity 0.6s ease,
transform 0.6s ease;

color:white;
}

.login-box.active{
opacity:1;
transform:translateX(0);
}

.login-box h2{
margin-bottom:20px;
font-size:30px;
}

.login-box input{
width:100%;
padding:14px;
margin-bottom:15px;

border:none;
outline:none;

border-radius:10px;

background:#2a2d34;
color:white;
font-size:15px;
}

.login-box button{
width:100%;
padding:14px;

border:none;
border-radius:10px;

background:#ffd54f;
color:#111;

font-weight:bold;
font-size:15px;

cursor:pointer;

transition:0.2s;
}

.login-box button:hover{
transform:scale(1.03);
}

/* ABAJUR */

.lamp-container{
position:relative;

display:flex;
flex-direction:column;
align-items:center;
}

/* CÚPULA */

.lamp-shade{
width:170px;
height:105px;

background:#1b1b1f;

border-radius:90px 90px 25px 25px;

position:relative;

transition:
background 0.4s,
box-shadow 0.4s;
}

body.light-on .lamp-shade{
background:#ffd54f;

box-shadow:
0 0 25px rgba(255,213,79,0.35),
0 0 60px rgba(255,213,79,0.15);
}

/* HASTE */

.lamp-base{
width:24px;
height:135px;
background:#2d2d33;
}

/* BASE */

.lamp-foot{
width:95px;
height:18px;

background:#3a3a42;

border-radius:12px;
}

/* CORDINHA */

.rope{
position:absolute;

top:105px;
right:50%;

transform:translateX(48px);

width:2px;
height:70px;

background:#b8b8b8;

cursor:grab;

transition:height 0.08s ease;
}

.handle{
position:absolute;

bottom:-7px;
left:-5px;

width:12px;
height:12px;

border-radius:50%;

background:#d0d0d0;
}

/* EFEITO RGB */

.rgb-overlay{
position:fixed;
inset:0;

pointer-events:none;

opacity:0;

transition:opacity 0.4s ease;

mix-blend-mode:screen;
}

body.light-on .rgb-overlay{
opacity:1;
}

</style>
</head>

<body>

<div class="rgb-overlay" id="rgbOverlay"></div>

<!-- LOGIN -->

<div class="login-box" id="loginBox">

<h2>Login</h2>

<input type="text" placeholder="Usuário">

<input type="password" placeholder="Senha">

<button>Entrar</button>

</div>

<!-- ABAJUR -->

<div class="lamp-container">

<div class="lamp-shade"></div>

<div class="lamp-base"></div>

<div class="lamp-foot"></div>

<div class="rope" id="rope">
<div class="handle"></div>
</div>

</div>

<script>

/* ELEMENTOS */

const rope = document.getElementById("rope");
const loginBox = document.getElementById("loginBox");
const rgbOverlay = document.getElementById("rgbOverlay");

/* ESTADOS */

let isOn = false;
let isDragging = false;
let startY = 0;

const defaultHeight = 70;

let rgbInterval = null;

/* GERADOR RGB */

function randomRGB(){

const r = Math.floor(Math.random()*255);
const g = Math.floor(Math.random()*255);
const b = Math.floor(Math.random()*255);

return `rgba(${r},${g},${b},0.15)`;

}

function updateRGB(){

rgbOverlay.style.background = `
radial-gradient(
circle at 82% 45%,
${randomRGB()},
transparent 30%
)
`;

}

/* DRAG */

rope.addEventListener("mousedown",(e)=>{

isDragging = true;

startY = e.clientY;

rope.style.cursor = "grabbing";

});

document.addEventListener("mousemove",(e)=>{

if(!isDragging) return;

let distance = e.clientY - startY;

if(distance > 0 && distance < 100){

rope.style.height = defaultHeight + distance + "px";

}

});

document.addEventListener("mouseup",(e)=>{

if(!isDragging) return;

let distance = e.clientY - startY;

isDragging = false;

rope.style.cursor = "grab";

rope.style.height = defaultHeight + "px";

if(distance > 50){

toggleLamp();

}

});

/* TOGGLE */

function toggleLamp(){

isOn = !isOn;

document.body.classList.toggle("light-on");

loginBox.classList.toggle("active");

if(isOn){

updateRGB();

rgbInterval = setInterval(updateRGB,250);

}else{

clearInterval(rgbInterval);

rgbOverlay.style.background = "transparent";

}

}

</script>

</body>
</html>
